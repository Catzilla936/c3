<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --calculator-bg: #ffffff;
            --calculator-shadow: rgba(0, 0, 0, 0.3);
            --display-bg: #1a1a1a;
            --display-text: #ffffff;
            --button-bg: #f0f0f0;
            --button-hover: #e0e0e0;
            --button-text: #333;
            --button-shadow: rgba(0, 0, 0, 0.2);
            --history-bg: #f8f9fa;
            --history-border: #e0e0e0;
            --history-text: #333;
            --history-item-hover: #e8e8e8;
        }

        [data-theme="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --calculator-bg: #0f3460;
            --calculator-shadow: rgba(0, 0, 0, 0.5);
            --display-bg: #16213e;
            --display-text: #ffffff;
            --button-bg: #1a1a2e;
            --button-hover: #16213e;
            --button-text: #ffffff;
            --button-shadow: rgba(0, 0, 0, 0.4);
            --history-bg: #1a1a2e;
            --history-border: #16213e;
            --history-text: #ffffff;
            --history-item-hover: #16213e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            padding: 20px;
            transition: background 0.3s ease;
            gap: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .calculator {
            background: var(--calculator-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--calculator-shadow);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            position: relative;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--button-bg);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--button-text);
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px var(--button-shadow);
        }

        .theme-toggle:hover {
            background: var(--button-hover);
            transform: scale(1.1);
        }

        .display {
            background: var(--display-bg);
            color: var(--display-text);
            font-size: 2.5rem;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            background: var(--button-bg);
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            color: var(--button-text);
        }

        button:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--button-shadow);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px var(--button-shadow);
        }

        .operator {
            background: #667eea;
            color: #ffffff;
        }

        .operator:hover {
            background: #5568d3;
        }

        .equals {
            background: #764ba2;
            color: #ffffff;
        }

        .equals:hover {
            background: #653a8a;
        }

        .clear {
            background: #ff6b6b;
            color: #ffffff;
        }

        .clear:hover {
            background: #ee5a5a;
        }

        .zero {
            grid-column: span 2;
        }

        .history {
            background: var(--history-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--calculator-shadow);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            max-height: 600px;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--history-border);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--history-border);
        }

        .history-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--button-text);
        }

        .history-clear {
            background: var(--button-bg);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--button-text);
            transition: all 0.2s;
            font-weight: 600;
        }

        .history-clear:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: var(--calculator-bg);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--history-border);
        }

        .history-item:hover {
            background: var(--history-item-hover);
            transform: translateX(5px);
            box-shadow: 0 2px 8px var(--button-shadow);
        }

        .history-expression {
            font-size: 1rem;
            color: var(--button-text);
            margin-bottom: 5px;
            word-wrap: break-word;
            opacity: 0.8;
        }

        .history-result {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--button-text);
            word-wrap: break-word;
        }

        .history-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--button-text);
            opacity: 0.5;
            font-style: italic;
        }

        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .history-list::-webkit-scrollbar-track {
            background: var(--history-bg);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: var(--button-bg);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb:hover {
            background: var(--button-hover);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .history {
                max-width: 100%;
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Переключить тему">🌙</button>
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="operator" onclick="appendOperator('/')">/</button>
                <button class="operator" onclick="appendOperator('*')">×</button>
                <button class="operator" onclick="deleteLast()">⌫</button>
                
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="appendOperator('-')">-</button>
                
                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="appendOperator('+')">+</button>
                
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button class="equals" onclick="calculate()" rowspan="2">=</button>
                
                <button class="zero" onclick="appendNumber('0')">0</button>
                <button onclick="appendDecimal()">.</button>
            </div>
        </div>

        <div class="history">
            <div class="history-header">
                <h2 class="history-title">Журнал операций</h2>
                <button class="history-clear" onclick="clearHistory()">Очистить</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">Журнал операций пуст</div>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '0';
        let shouldResetDisplay = false;
        let operationHistory = [];

        // Загрузка истории из localStorage
        function loadHistory() {
            const savedHistory = localStorage.getItem('calculatorHistory');
            if (savedHistory) {
                operationHistory = JSON.parse(savedHistory);
                renderHistory();
            }
        }

        // Сохранение истории в localStorage
        function saveHistory() {
            localStorage.setItem('calculatorHistory', JSON.stringify(operationHistory));
        }

        // Добавление операции в журнал
        function addToHistory(expression, result) {
            const historyItem = {
                expression: expression,
                result: result,
                timestamp: new Date().toLocaleString('ru-RU')
            };
            operationHistory.unshift(historyItem);
            
            // Ограничиваем количество записей (последние 50)
            if (operationHistory.length > 50) {
                operationHistory = operationHistory.slice(0, 50);
            }
            
            saveHistory();
            renderHistory();
        }

        // Отображение истории
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            
            if (operationHistory.length === 0) {
                historyList.innerHTML = '<div class="history-empty">Журнал операций пуст</div>';
                return;
            }
            
            historyList.innerHTML = operationHistory.map((item, index) => `
                <div class="history-item" onclick="useFromHistory(${index})">
                    <div class="history-expression">${formatExpression(item.expression)}</div>
                    <div class="history-result">= ${item.result}</div>
                </div>
            `).join('');
        }

        // Форматирование выражения для отображения
        function formatExpression(expr) {
            return expr.replace(/\*/g, '×');
        }

        // Использование результата из истории
        function useFromHistory(index) {
            if (operationHistory[index]) {
                const result = operationHistory[index].result;
                if (result !== 'Ошибка') {
                    currentInput = result.toString();
                    updateDisplay();
                }
            }
        }

        // Очистка истории
        function clearHistory() {
            if (operationHistory.length > 0) {
                if (confirm('Вы уверены, что хотите очистить журнал операций?')) {
                    operationHistory = [];
                    saveHistory();
                    renderHistory();
                }
            }
        }

        // Инициализация темы
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        // Переключение темы
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        // Обновление иконки темы
        function updateThemeIcon(theme) {
            const themeToggle = document.getElementById('themeToggle');
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        // Загружаем тему при загрузке страницы
        initTheme();
        
        // Загружаем историю при загрузке страницы
        loadHistory();

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendNumber(number) {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            
            if (currentInput === '0') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOperator(operator) {
            if (shouldResetDisplay) {
                shouldResetDisplay = false;
            }
            
            const lastChar = currentInput[currentInput.length - 1];
            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + operator;
            } else {
                currentInput += operator;
            }
            updateDisplay();
        }

        function calculate() {
            try {
                // Сохраняем оригинальное выражение для истории
                const originalExpression = currentInput;
                
                // Заменяем × на * для вычисления
                let expression = currentInput.replace(/×/g, '*');
                
                // Проверяем на деление на ноль
                if (expression.includes('/0') && !expression.includes('/0.')) {
                    currentInput = 'Ошибка';
                    updateDisplay();
                    addToHistory(originalExpression, 'Ошибка');
                    shouldResetDisplay = true;
                    return;
                }
                
                const result = Function('"use strict"; return (' + expression + ')')();
                
                if (isNaN(result) || !isFinite(result)) {
                    currentInput = 'Ошибка';
                    addToHistory(originalExpression, 'Ошибка');
                } else {
                    const resultStr = result.toString();
                    currentInput = resultStr;
                    addToHistory(originalExpression, resultStr);
                }
                
                updateDisplay();
                shouldResetDisplay = true;
            } catch (error) {
                const originalExpression = currentInput;
                currentInput = 'Ошибка';
                updateDisplay();
                addToHistory(originalExpression, 'Ошибка');
                shouldResetDisplay = true;
            }
        }

        function clearDisplay() {
            currentInput = '0';
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (shouldResetDisplay) {
                clearDisplay();
                return;
            }
            
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // Поддержка клавиатуры
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendNumber(key);
            } else if (key === '.') {
                appendDecimal();
            } else if (key === '+') {
                appendOperator('+');
            } else if (key === '-') {
                appendOperator('-');
            } else if (key === '*') {
                appendOperator('*');
            } else if (key === '/') {
                event.preventDefault();
                appendOperator('/');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === 'Backspace') {
                deleteLast();
            }
        });
    </script>
</body>
</html>
